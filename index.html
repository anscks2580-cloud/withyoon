<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WITH YUN WEDDING | 홈페이지 시안</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#1a1a1a}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:4px;padding:6px;background:rgba(20,20,20,.92);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.28);font-family:'Noto Sans KR',sans-serif}
.bar span{color:#cfcfcf;font-size:12px;padding:0 10px 0 12px;white-space:nowrap}
.bar a{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;color:#e6e6e6;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;transition:background-color .2s,color .2s}
.bar a b{font-size:15px}
.bar a:hover{background:rgba(255,255,255,.12)}
.bar a[aria-current="page"]{background:#fff;color:#111}
@media (max-width:560px){.bar span{display:none}.bar a small{display:none}.bar a{padding:0 18px}}
</style>
</head>
<body>
<iframe id="view" title="홈페이지 시안 미리보기" src="a.html"></iframe>
<nav class="bar" aria-label="시안 선택">
<span>위드윤웨딩 시안</span>
<a href="#a" data-v="a"><b>A</b><small>여백 미니멀</small></a>
<a href="#b" data-v="b"><b>B</b><small>메종</small></a>
<a href="#c" data-v="c"><b>C</b><small>다크 에디토리얼</small></a>
</nav>
<script>
(function(){
var view=document.getElementById('view');
var links=document.querySelectorAll('.bar a');
function show(){
var v=(location.hash||'#a').slice(1);
if(['a','b','c'].indexOf(v)<0)v='a';
if(view.getAttribute('src')!==v+'.html')view.setAttribute('src',v+'.html');
links.forEach(function(l){if(l.dataset.v===v)l.setAttribute('aria-current','page');else l.removeAttribute('aria-current');});
}
window.addEventListener('hashchange',show);show();
})();
</script>
</body>
</html>
